# IPTV Playlist Generator Configuration
general:
  source_file: sources.txt
  output_file: playlist.m3u
  output_epg: light_epg.xml
  timeout: 10
  stream_timeout: 3
  max_workers: 64
  spam_keywords:
    - "mời quý khán giả"
    - "thông báo"
    - "tạm ngưng"
    - "bảo trì"
    - "kênh dự phòng"
    - "test"

cache:
  enabled: true
  dir: .cache
  epg_ttl: 3600
  source_ttl: 300
  link_ttl: 600
