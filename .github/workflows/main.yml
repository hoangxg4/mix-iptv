name: Update IPTV Playlist

on:
  schedule:
    # Tự động chạy mỗi 6 tiếng một lần (vào các giờ 00:00, 06:00, 12:00, 18:00 giờ UTC)
    - cron: '0 */6 * * *'
  
  workflow_dispatch: # Cho phép bạn bấm nút "Run workflow" để chạy thủ công bất kỳ lúc nào
  
  push:
    paths:
      - 'sources.txt' # Tự động kích hoạt chạy khi bạn cập nhật danh sách link nguồn

# Cơ chế chống xung đột: Nếu có job mới kích hoạt, job cũ đang chạy sẽ tự động bị hủy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pyyaml

      - name: Run merge, EPG trim, and JSON export
        run: python main.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Thẻ [skip ci] cực kỳ quan trọng để tránh tạo vòng lặp chạy vô tận khi bot commit sources.txt
          commit_message: "🤖 Auto-update playlist, EPG, JSON & source status [skip ci]"
          
          # Theo dõi và cập nhật đồng thời cả 4 file sau khi script Python thực thi xong
          file_pattern: "playlist.m3u light_epg.xml channels.json sources.txt"
