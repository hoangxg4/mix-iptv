name: Update IPTV Playlist

on:
  schedule:
    # Tự động chạy mỗi 6 tiếng một lần (vào các giờ 00:00, 06:00, 12:00, 18:00 giờ UTC)
    - cron: '0 */6 * * *'
  
  workflow_dispatch: # Cho phép bạn bấm nút "Run workflow" để chạy thủ công bất kỳ lúc nào
  
  push:
    paths:
      - 'sources.txt' # Tự động kích hoạt chạy khi bạn cập nhật danh sách link nguồn

# Cơ chế chống xung đột: Nếu có job mới kích hoạt, job cũ đang chạy sẽ tự động bị hủy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pyyaml

      - name: Run merge, EPG trim, and JSON export
        run: python main.py

      - name: Commit sources.txt + docs/ to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Chỉ commit file nhỏ: sources.txt (track alive/dead) + docs/ (web page)
          git add sources.txt docs/
          git diff --staged --quiet || git commit -m "🤖 Auto-update source status & docs [skip ci]"
          git push

      - name: Upload large files to Release
        run: |
          RELEASE_TAG="latest"
          # Xoá release cũ (nếu có) — --cleanup-tag xoá luôn tag
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          # Tạo release mới với assets là các file lớn
          gh release create "$RELEASE_TAG" \
            playlist.m3u light_epg.xml channels.json \
            --title "🤖 IPTV Auto-Update" \
            --notes "Tự động cập nhật: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
