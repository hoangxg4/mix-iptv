name: Update IPTV Playlist

on:
  schedule:
    # Chạy tự động mỗi 12 tiếng
    - cron: '0 */12 * * *'
  
  workflow_dispatch: # Cho phép bấm nút chạy thủ công
  
  push:
    paths:
      - 'sources.txt' # Tự động chạy khi file này có thay đổi

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Nâng cấp lên v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Nâng cấp lên v5
        with:
          python-version: '3.10' # Lên 3.10 cho tốc độ xử lý nhanh hơn

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run merge and EPG trim script
        run: python main.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5 # Nâng cấp v5
        with:
          commit_message: "🤖 Auto-update playlist and light EPG [skip ci]"
          # CHÚ Ý: Bổ sung thêm light_epg.xml vào danh sách commit
          file_pattern: "playlist.m3u light_epg.xml"
