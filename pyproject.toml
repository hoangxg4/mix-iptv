[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "m3u_builder", "config", "cache", "epg", "output"]

[project]
name = "mix-iptv"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "pyyaml",
    "aiohttp-socks",
    "pytest",
    "pytest-asyncio",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
